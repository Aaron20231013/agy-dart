name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  verify:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        node-version: ["22.16.0", "22", "24"]

    runs-on: ${{ matrix.os }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js ${{ matrix.node-version }}
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}

      - name: Verify package import graph
        run: node scripts/verify-package-graph.mjs

      - name: Run full test suite (zero npm dependencies)
        run: npm test

      - name: Audit Turn-0 prefix budget & MCP schema determinism
        run: npm run prefix:budget

      - name: Audit Prompt Cache configuration
        run: npm run cache:audit -- --workspace . --no-live

      - name: Verify AI_REVIEW_BRIEF.md metrics have zero drift
        run: node scripts/gen-review-brief.mjs --check
