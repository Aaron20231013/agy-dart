<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 250" width="880" height="250" role="img" aria-label="agy-dart 架构示意图">
  <defs>
    <linearGradient id="bgL" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#f8fafc"/>
      <stop offset="100%" stop-color="#f1f5f9"/>
    </linearGradient>
    <linearGradient id="accentL" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#0284c7"/>
      <stop offset="100%" stop-color="#4f46e5"/>
    </linearGradient>
  </defs>
  <rect width="880" height="250" rx="14" fill="url(#bgL)" stroke="#cbd5e1" stroke-width="1.5"/>
  <!-- Host Box -->
  <rect x="24" y="42" width="188" height="166" rx="10" fill="#ffffff" stroke="#94a3b8" stroke-width="1.5"/>
  <text x="118" y="72" text-anchor="middle" fill="#0f172a" font-family="system-ui,-apple-system,'PingFang SC','Microsoft YaHei','Segoe UI',sans-serif" font-size="14" font-weight="700">Antigravity 客户端</text>
  <text x="118" y="95" text-anchor="middle" fill="#475569" font-family="system-ui,-apple-system,'PingFang SC','Microsoft YaHei',sans-serif" font-size="11">桌面端 2.0 · IDE · CLI</text>
  <rect x="36" y="112" width="164" height="26" rx="6" fill="#f1f5f9"/>
  <text x="118" y="129" text-anchor="middle" fill="#334155" font-family="system-ui,-apple-system,'PingFang SC','Microsoft YaHei',sans-serif" font-size="11">开局前缀 &lt;=3k 稳缓存</text>
  <rect x="36" y="146" width="164" height="26" rx="6" fill="#e0f2fe"/>
  <text x="118" y="163" text-anchor="middle" fill="#0369a1" font-family="system-ui,-apple-system,'PingFang SC','Microsoft YaHei',sans-serif" font-size="11">防误改插件目录守卫</text>
  <text x="118" y="194" text-anchor="middle" fill="#64748b" font-family="system-ui,-apple-system,'PingFang SC','Microsoft YaHei',sans-serif" font-size="10.5">跨目录无漂移钩子启动</text>

  <!-- Arrows 1 -->
  <path d="M212 95 L252 95" stroke="#0284c7" stroke-width="2" fill="none"/>
  <polygon points="252,95 245,91 245,99" fill="#0284c7"/>
  <path d="M212 158 L252 158" stroke="#4f46e5" stroke-width="2" fill="none"/>
  <polygon points="252,158 245,154 245,162" fill="#4f46e5"/>

  <!-- Dual Engine Center -->
  <rect x="256" y="24" width="356" height="202" rx="12" fill="#ffffff" stroke="url(#accentL)" stroke-width="1.8"/>
  <text x="434" y="49" text-anchor="middle" fill="#0f172a" font-family="system-ui,-apple-system,'PingFang SC','Microsoft YaHei','Segoe UI',sans-serif" font-size="13.5" font-weight="700">agy-dart 双引擎（零依赖 · 单次返回 &lt;=8.8 KB）</text>

  <rect x="272" y="62" width="324" height="68" rx="8" fill="#f0f9ff" stroke="#7dd3fc" stroke-width="1"/>
  <text x="286" y="82" fill="#0369a1" font-family="ui-monospace,SFMono-Regular,Consolas,'PingFang SC','Microsoft YaHei',sans-serif" font-size="11.5" font-weight="700">agy-dart_fast（默认直连 4 工具 · 170s 保护）</text>
  <text x="286" y="101" fill="#1e293b" font-family="system-ui,-apple-system,'PingFang SC','Microsoft YaHei',sans-serif" font-size="11">批量搜索 · 多文件修改 · 按行看目录切片 · 并发跑检查</text>
  <text x="286" y="119" fill="#0284c7" font-family="system-ui,-apple-system,'PingFang SC','Microsoft YaHei',sans-serif" font-size="10">短项省额度让给报错堆栈 · 扁平行号切片 · Git 只读沙盒</text>

  <rect x="272" y="140" width="324" height="72" rx="8" fill="#eef2ff" stroke="#a5b4fc" stroke-width="1"/>
  <text x="286" y="160" fill="#4338ca" font-family="ui-monospace,SFMono-Regular,Consolas,'PingFang SC','Microsoft YaHei',sans-serif" font-size="11.5" font-weight="700">agy-dart_context + 5 钩子（SQLite 本地检索库）</text>
  <text x="286" y="179" fill="#1e293b" font-family="system-ui,-apple-system,'PingFang SC','Microsoft YaHei',sans-serif" font-size="11">拦截长日志噪音 · 大 JSON 摘要 · 重复读文件去重</text>
  <text x="286" y="198" fill="#4f46e5" font-family="system-ui,-apple-system,'PingFang SC','Microsoft YaHei',sans-serif" font-size="10">密钥自动打码 · 防内网穿透 · /compact 后恢复进度</text>

  <!-- Arrow 2 -->
  <path d="M612 125 L652 125" stroke="#059669" stroke-width="2" fill="none"/>
  <polygon points="652,125 645,121 645,129" fill="#059669"/>

  <!-- Sidecar Right -->
  <rect x="656" y="42" width="200" height="166" rx="10" fill="#ffffff" stroke="#10b981" stroke-width="1.5"/>
  <text x="756" y="70" text-anchor="middle" fill="#047857" font-family="system-ui,-apple-system,'PingFang SC','Microsoft YaHei','Segoe UI',sans-serif" font-size="14" font-weight="700">右侧实时监控面板</text>
  <rect x="668" y="84" width="176" height="26" rx="6" fill="#ecfdf5"/>
  <text x="756" y="101" text-anchor="middle" fill="#065f46" font-family="system-ui,-apple-system,'PingFang SC','Microsoft YaHei',sans-serif" font-size="11">缓存到期前自动续温 (3次)</text>
  <rect x="668" y="118" width="176" height="26" rx="6" fill="#f1f5f9"/>
  <text x="756" y="135" text-anchor="middle" fill="#334155" font-family="system-ui,-apple-system,'PingFang SC','Microsoft YaHei',sans-serif" font-size="11">多窗口告警点击直达对话</text>
  <rect x="668" y="152" width="176" height="26" rx="6" fill="#f1f5f9"/>
  <text x="756" y="169" text-anchor="middle" fill="#334155" font-family="system-ui,-apple-system,'PingFang SC','Microsoft YaHei',sans-serif" font-size="11">卡死监测与崩溃一键抢救</text>
  <text x="756" y="196" text-anchor="middle" fill="#64748b" font-family="ui-monospace,SFMono-Regular,Consolas,'PingFang SC','Microsoft YaHei',sans-serif" font-size="10">127.0.0.1 本地防伪造保护</text>
</svg>
