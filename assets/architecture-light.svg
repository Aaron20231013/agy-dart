<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 250" width="880" height="250" role="img" aria-label="agy-dart architecture">
  <defs>
    <linearGradient id="bgL" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#f8fafc"/>
      <stop offset="100%" stop-color="#f1f5f9"/>
    </linearGradient>
    <linearGradient id="accentL" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#0284c7"/>
      <stop offset="100%" stop-color="#4f46e5"/>
    </linearGradient>
  </defs>
  <rect width="880" height="250" rx="14" fill="url(#bgL)" stroke="#cbd5e1" stroke-width="1.5"/>
  <!-- Host Box -->
  <rect x="24" y="42" width="188" height="166" rx="10" fill="#ffffff" stroke="#94a3b8" stroke-width="1.5"/>
  <text x="118" y="72" text-anchor="middle" fill="#0f172a" font-family="system-ui,-apple-system,Segoe UI,sans-serif" font-size="14" font-weight="700">Antigravity Host</text>
  <text x="118" y="95" text-anchor="middle" fill="#475569" font-family="system-ui,sans-serif" font-size="11">Desktop 2.0 · IDE · CLI</text>
  <rect x="40" y="112" width="156" height="26" rx="6" fill="#f1f5f9"/>
  <text x="118" y="129" text-anchor="middle" fill="#334155" font-family="ui-monospace,SFMono-Regular,Consolas,Menlo,monospace" font-size="11">Turn-0 Prefix &lt;=3k tok</text>
  <rect x="40" y="146" width="156" height="26" rx="6" fill="#e0f2fe"/>
  <text x="118" y="163" text-anchor="middle" fill="#0369a1" font-family="ui-monospace,SFMono-Regular,Consolas,Menlo,monospace" font-size="11">roots/list + CWD Guard</text>
  <text x="118" y="194" text-anchor="middle" fill="#64748b" font-family="system-ui,sans-serif" font-size="10">Zero-drift Hook Loader</text>

  <!-- Arrows 1 -->
  <path d="M212 95 L252 95" stroke="#0284c7" stroke-width="2" fill="none"/>
  <polygon points="252,95 245,91 245,99" fill="#0284c7"/>
  <path d="M212 158 L252 158" stroke="#4f46e5" stroke-width="2" fill="none"/>
  <polygon points="252,158 245,154 245,162" fill="#4f46e5"/>

