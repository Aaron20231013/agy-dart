  <text x="434" y="49" text-anchor="middle" fill="#0f172a" font-family="system-ui,-apple-system,Segoe UI,sans-serif" font-size="14" font-weight="700">agy-dart Dual Engine (Zero npm deps · &lt;=8.8 KB)</text>

  <rect x="272" y="62" width="324" height="68" rx="8" fill="#f0f9ff" stroke="#7dd3fc" stroke-width="1"/>
  <text x="286" y="82" fill="#0369a1" font-family="ui-monospace,SFMono-Regular,Consolas,Menlo,monospace" font-size="12" font-weight="700">agy-dart_fast (Eager 4 Tools · 170s Budget)</text>
  <text x="286" y="101" fill="#1e293b" font-family="system-ui,sans-serif" font-size="11">batch_search · apply_edits · read_slices · run_checks</text>
  <text x="286" y="119" fill="#0284c7" font-family="system-ui,sans-serif" font-size="10">Water-filling quota · Flat lineRanges · Safe Git sandbox</text>

  <rect x="272" y="140" width="324" height="72" rx="8" fill="#eef2ff" stroke="#a5b4fc" stroke-width="1"/>
  <text x="286" y="160" fill="#4338ca" font-family="ui-monospace,SFMono-Regular,Consolas,Menlo,monospace" font-size="12" font-weight="700">agy-dart_context + 5 Hooks (SQLite WAL/FTS5)</text>
  <text x="286" y="179" fill="#1e293b" font-family="system-ui,sans-serif" font-size="11">CLI noise filter · JSON crusher · 2-strike Read Dedup</text>
  <text x="286" y="198" fill="#4f46e5" font-family="system-ui,sans-serif" font-size="10">SSRF IP-pinning · Secret redaction · /compact resume</text>

  <!-- Arrow 2 -->
  <path d="M612 125 L652 125" stroke="#059669" stroke-width="2" fill="none"/>
  <polygon points="652,125 645,121 645,129" fill="#059669"/>

  <!-- Sidecar Right -->
  <rect x="656" y="42" width="200" height="166" rx="10" fill="#ffffff" stroke="#10b981" stroke-width="1.5"/>
  <text x="756" y="70" text-anchor="middle" fill="#047857" font-family="system-ui,-apple-system,Segoe UI,sans-serif" font-size="14" font-weight="700">Live Sidecar Panel</text>
  <rect x="672" y="84" width="168" height="26" rx="6" fill="#ecfdf5"/>
  <text x="756" y="101" text-anchor="middle" fill="#065f46" font-family="system-ui,sans-serif" font-size="11">Auto Cache Keepalive (3x)</text>
  <rect x="672" y="118" width="168" height="26" rx="6" fill="#f1f5f9"/>
  <text x="756" y="135" text-anchor="middle" fill="#334155" font-family="system-ui,sans-serif" font-size="11">Click-to-Jump Window Alerts</text>
  <rect x="672" y="152" width="168" height="26" rx="6" fill="#f1f5f9"/>
  <text x="756" y="169" text-anchor="middle" fill="#334155" font-family="system-ui,sans-serif" font-size="11">Stall Watchdog &amp; Rescue</text>
  <text x="756" y="196" text-anchor="middle" fill="#64748b" font-family="ui-monospace,SFMono-Regular,Consolas,Menlo,monospace" font-size="10">127.0.0.1 CSRF-Hardened</text>
