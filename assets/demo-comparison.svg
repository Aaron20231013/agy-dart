<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 210" width="880" height="210" role="img" aria-label="Before vs With agy-dart live comparison">
  <style>
    .pulse { animation: glow 2.8s ease-in-out infinite; }
    .barGrow { animation: fillBar 3.6s ease-out infinite; transform-origin: left center; }
    @keyframes glow { 0%, 100% { opacity: 0.78; } 50% { opacity: 1; } }
    @keyframes fillBar { 0% { transform: scaleX(0.82); } 50% { transform: scaleX(1); } 100% { transform: scaleX(0.82); } }
  </style>
  <rect width="880" height="210" rx="14" fill="#0b1120" stroke="#1e293b" stroke-width="1.5"/>

  <!-- Left: Without agy-dart -->
  <rect x="20" y="18" width="408" height="174" rx="10" fill="#18181b" stroke="#3f3f46" stroke-width="1.2"/>
  <circle cx="38" cy="36" r="5" fill="#ef4444"/>
  <text x="52" y="40" fill="#fca5a5" font-family="system-ui,sans-serif" font-size="12" font-weight="700">Without agy-dart — 6 Serial Turns + Log Flood</text>
  <text x="36" y="66" fill="#a1a1aa" font-family="ui-monospace,SFMono-Regular,Consolas,Menlo,monospace" font-size="11">Turn 1..4: grep, grep, read 2,400 lines, edit x3</text>
  <text x="36" y="86" fill="#f87171" font-family="ui-monospace,SFMono-Regular,Consolas,Menlo,monospace" font-size="11">Turn 5   : npm test -&gt; 94 KB stdout spilled to output.txt</text>
  <text x="36" y="106" fill="#fbbf24" font-family="ui-monospace,SFMono-Regular,Consolas,Menlo,monospace" font-size="11">Turn 6   : 6m coffee break -&gt; KV-Cache EXPIRED (0% hit)</text>
  <rect x="36" y="128" width="376" height="14" rx="7" fill="#27272a"/>
  <rect x="36" y="128" width="342" height="14" rx="7" fill="#dc2626"/>
  <text x="36" y="164" fill="#fca5a5" font-family="system-ui,sans-serif" font-size="11">Context burned: 91% · Full prompt re-billed on cache miss</text>

  <!-- Right: With agy-dart -->
  <rect x="452" y="18" width="408" height="174" rx="10" fill="#0f172a" stroke="#10b981" stroke-width="1.5"/>
  <circle cx="470" cy="36" r="5" fill="#10b981" class="pulse"/>
  <text x="484" y="40" fill="#6ee7b7" font-family="system-ui,sans-serif" font-size="12" font-weight="700">With agy-dart — Batched + Sidecar Keepalive</text>
  <text x="468" y="66" fill="#bae6fd" font-family="ui-monospace,SFMono-Regular,Consolas,Menlo,monospace" font-size="11">1 call : batch_search(4) + read_slices(lineRanges)</text>
  <text x="468" y="86" fill="#86efac" font-family="ui-monospace,SFMono-Regular,Consolas,Menlo,monospace" font-size="11">1 call : apply_edits(3 files + inline verify &lt;=8.8 KB)</text>
  <text x="468" y="106" fill="#c4b5fd" font-family="ui-monospace,SFMono-Regular,Consolas,Menlo,monospace" font-size="11">Sidecar: Auto-Keepalive 1/3 @ T-30s -&gt; 94.6% Cache Hit</text>
  <rect x="468" y="128" width="376" height="14" rx="7" fill="#1e293b"/>
  <rect x="468" y="128" width="96" height="14" rx="7" fill="#10b981" class="barGrow"/>
  <text x="468" y="164" fill="#6ee7b7" font-family="system-ui,sans-serif" font-size="11">Context used: 24% (-67% noise) · Warm cache preserved</text>
</svg>
